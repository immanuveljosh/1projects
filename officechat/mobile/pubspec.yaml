name: mobile
description: "OfficeChat enterprise mobile client for Android and iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # WebSocket Client
  web_socket_channel: ^3.0.3

  # Local DB & Persistence
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  cached_network_image: ^3.3.1
  open_filex: ^4.4.0

  # Markdown, Icons, Emoji & Localization
  flutter_markdown: ^0.7.2
  emoji_picker_flutter: ^3.0.0
  intl: ^0.19.0

  # System & Utilities
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
