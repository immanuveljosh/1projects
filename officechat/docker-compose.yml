version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: officechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-officechat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-officechat_secret}
      POSTGRES_DB: ${DB_NAME:-officechat_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-officechat} -d ${DB_NAME:-officechat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - officechat-network

  redis:
    image: redis:7-alpine
    container_name: officechat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - officechat-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: officechat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - officechat-network

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: officechat-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-officechat-files};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET:-officechat-files};
      exit 0;
      "
    networks:
      - officechat-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: officechat-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-officechat}
      DB_PASSWORD: ${DB_PASSWORD:-officechat_secret}
      DB_NAME: ${DB_NAME:-officechat_db}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-officechat-files}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-officechat_access_token_secret_32bytes_min_length!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-officechat_refresh_token_secret_32bytes_min_length!}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - officechat-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: officechat-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - officechat-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  officechat-network:
    driver: bridge
